name: Morning briefing

on:
  schedule:
    # 04:00 UTC = 06:00 Europe/Rome (CEST). After the late-Oct DST change this
    # becomes 05:00 CET — nudge the hour below if you want it back at 6am.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and post briefing
        env:
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
          ICU_ATHLETE_ID: ${{ secrets.ICU_ATHLETE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/morning-briefing.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- data/briefing.json; then
            echo "No change to data/briefing.json, nothing to commit."
            exit 0
          fi
          git config user.name "pirin-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefing.json
          git commit -m "coach: morning briefing $(date -u +%F)"
          git push
