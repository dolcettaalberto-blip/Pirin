name: Morning briefing

# On-demand only, for now — fired by the "Generate briefing" button on the
# Today tab (POST /api/briefing/trigger) or manually from the Actions tab.
# Add a `schedule:` trigger back here if you want it to also run automatically.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and post briefing
        env:
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
          ICU_ATHLETE_ID: ${{ secrets.ICU_ATHLETE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/morning-briefing.mjs
      - name: Commit and push
        run: |
          git add data/briefing.json
          if git diff --cached --quiet -- data/briefing.json; then
            echo "No change to data/briefing.json, nothing to commit."
            exit 0
          fi
          git config user.name "pirin-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "coach: morning briefing $(date -u +%F)"

          # main can move between checkout and push (another session/coach
          # conversation pushing plan changes concurrently) — rebase onto the
          # latest and retry a few times instead of failing the whole run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed, aborting."
              git rebase --abort
              exit 1
            fi
          done
          echo "Failed to push after retries."
          exit 1
